
name: Build MISQARAH Android APP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Flutter ZIP
        run: |
          mkdir -p app_src
          unzip -o MISQARAH_PERFUMERY_HOUSE_Flutter_Starter-1.zip -d app_src

      - name: Create Android Project Structure
        working-directory: app_src
        run: |
          flutter create --platforms=android --project-name=misqarah_perfumery_house .

      - name: Install Dependencies
        working-directory: app_src
        run: flutter pub get

      - name: Build Release APK
        working-directory: app_src
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MISQARAH-PERFUMERY-HOUSE-APK
          path: app_src/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

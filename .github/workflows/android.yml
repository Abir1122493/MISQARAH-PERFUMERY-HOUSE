
name: Build MISQARAH Android App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Flutter Project
        run: |
          mkdir app_src
          unzip -o MISQARAH_PERFUMERY_HOUSE_Flutter_Starter.zip -d app_src

      - name: Create Android Project
        working-directory: app_src
        run: flutter create . --platforms=android

      - name: Install Dependencies
        working-directory: app_src
        run: flutter pub get

      - name: Build Android APK
        working-directory: app_src
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MISQARAH-Android-APK
          path: app_src/build/app/outputs/flutter-apk/app-release.apk

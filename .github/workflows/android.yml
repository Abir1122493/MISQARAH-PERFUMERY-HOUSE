name: Build MISQARAH Website APP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Website Flutter Project
        run: | mkdir -p app_src unzip -o MISQARAH_WEBSITE_APP.zip -d app_src 
      - name: Create Android Structure
        working-directory: app_src
        run: flutter create --platforms=android --project-name=misqarah_perfumery_house .

      - name: Ensure Internet Permission
        run: | MANIFEST="app_src/android/app/src/main/AndroidManifest.xml" grep -q 'android.permission.INTERNET' "$MANIFEST" || sed -i '/<manifest/a\ <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST" 
      - name: Get Dependencies
        working-directory: app_src
        run: flutter pub get

      - name: Build Release APK
        working-directory: app_src
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MISQARAH-WEBSITE-APK
          path: app_src/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
